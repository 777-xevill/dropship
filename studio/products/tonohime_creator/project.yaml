product:
  name: TONO HIME Water-based Gel
  name_bn: টোনো হিমে ওয়াটার-বেসড জেল
  short_name: TONO HIME
  what_it_is: 100 ml water-based personal lubricant gel (ব্যক্তিগত লুব্রিকেন্ট জেল) for married adults 18+. The presenter must NAME the category plainly ('লুব্রিকেন্ট জেল', 'স্বামী-স্ত্রীর ব্যক্তিগত জীবনের জন্য', 'দাম্পত্য জীবনের স্বস্তি') so viewers who have never heard of it understand what it is, but never describes the sexual act, body parts, pleasure, stamina or performance. Educational, calm, respectful tone. Presenter wears a stethoscope as a style accessory but is NOT a doctor and never says or implies she is.
  benefits:
  - পানি-ভিত্তিক, আঠালো না
  - পানিতে সহজে ধুয়ে যায়
  - কাপড়ে দাগ পড়ে না
  - শুষ্কতাজনিত অস্বস্তি কমাতে সাহায্য করে
  - '৩টি সুগন্ধ: স্ট্রবেরি, ব্লুবেরি, আঙুর'
  proof:
  - প্যাকেটের বাইরে পণ্যের নাম থাকে না (গোপনীয় প্যাকেজিং)
  - পণ্য হাতে পেয়ে দেখে টাকা দেওয়া যায় (ক্যাশ অন ডেলিভারি)
  - সারা দেশে ফ্রি ডেলিভারি
  - কল করলেই দাম ও অর্ডারের বিস্তারিত জানানো হয়
  avoid:
  - any price or money amount
  - ১০০% নিরাপদ / কোনো পার্শ্বপ্রতিক্রিয়া নেই
  - জাপানি / অরিজিনাল
  - sex act, pleasure, performance, stamina, 'time' or enhancement claims
  - body parts, banana/fruit or any other innuendo
  - asking the viewer about their body or health problems
  - claiming or implying the presenter is a doctor, or that a doctor recommends it
  - treatment or cure claims
  - পানির মতো পাতলা বা হালকা বলা যাবে না (gel is thicker than water, that is a quality sign)
  audience: men and women 30-70 in Bangladesh, mostly men; most have never used or understood a lubricant, so explain what it is in one simple sentence; privacy and convenience focus

<!doctype html>
<html><head><meta charset="utf-8"><style>
{{ font_css() }}
html,body{margin:0;width:{{W}}px;height:{{H}}px;overflow:hidden}
body{background:linear-gradient(170deg, {{ c.primary }} 0%, {{ c.dark }} 100%);font-family:'Anek Bangla','Hind Siliguri',sans-serif;color:#fff}
.glow{position:absolute;left:50%;top:880px;width:1100px;height:1100px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.30), rgba(255,255,255,0) 62%)}
.top{position:absolute;top:250px;left:70px;right:70px;text-align:center}
.page{display:inline-block;font-weight:600;font-size:40px;letter-spacing:.5px;padding:10px 30px;border-radius:999px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35)}
h1{margin:34px 0 0;font-size:{{ 92 if (title|length) < 18 else 76 }}px;line-height:1.18;font-weight:800;text-shadow:0 6px 24px rgba(0,0,0,.25)}
.prod{position:absolute;left:50%;top:880px;transform:translate(-50%,-50%);max-width:760px;max-height:640px;filter:drop-shadow(0 40px 50px rgba(0,0,0,.45))}
.bottom{position:absolute;left:60px;right:60px;top:1250px;display:flex;flex-direction:column;align-items:center;gap:30px}
.call{display:flex;align-items:center;gap:22px;background:#fff;color:{{ c.dark }};border-radius:999px;padding:26px 54px;
  font-weight:800;font-size:66px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.call .ph{font-family:'Poppins';font-weight:800;letter-spacing:1px}
.badges{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.badges span{font-weight:600;font-size:40px;padding:12px 28px;border-radius:999px;background:rgba(0,0,0,.22);border:2px solid rgba(255,255,255,.3)}
</style></head><body>
<div class="glow"></div>
<div class="top">{% if page %}<div class="page">{{ page }}</div>{% endif %}<h1>{{ title }}</h1></div>
{% if product %}<img class="prod" src="{{ product|img }}">{% endif %}
<div class="bottom">
  {% if phone %}<div class="call"><span>📞</span><span class="ph">{{ phone }}</span></div>{% elif button %}<div class="call">{{ button }}</div>{% endif %}
  {% if badges %}<div class="badges">{% for b in badges %}<span>{{ b }}</span>{% endfor %}</div>{% endif %}
</div>
</body></html>
